<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Sound Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --bg:#0f0f23; --card:#1a1a3e; --ink:#ffffff; --sub:#a0aec0; --m1:#f6c90e; --m2:#ff6b9d; --m3:#00d4aa; --border:rgba(255,255,255,0.12); --opt:#1e2a4a; --red:#ef4444; }
html,body { height:100%; overflow:hidden; position:fixed; width:100%; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--ink); height:100vh; height:calc(var(--vh,1vh)*100); display:flex; flex-direction:column; padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)) 10px; }
body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background-image: radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,0.6) 0%,transparent 100%), radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,0.3) 0%,transparent 100%), radial-gradient(2px 2px at 60% 55%,rgba(246,201,14,0.4) 0%,transparent 100%), radial-gradient(2px 2px at 25% 35%,rgba(0,212,170,0.3) 0%,transparent 100%); }
.app { width:100%; max-width:520px; margin:0 auto; flex:1; display:flex; flex-direction:column; position:relative; z-index:1; min-height:0; gap:8px; }
.header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.logo { font-family:'Rubik',sans-serif; font-weight:900; font-size:18px; letter-spacing:-0.5px; }
.logo span { color:var(--m1); }
.stats { display:flex; gap:5px; }
.stat { background:rgba(255,255,255,0.08); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:12px; font-weight:800; display:flex; align-items:center; gap:3px; }
.stat.s-score { color:var(--m1); } .stat.s-streak { color:var(--m2); }
.reset-btn { width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--sub); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.mode-bar { display:flex; gap:5px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:14px; padding:4px; flex-shrink:0; }
.mode-btn { flex:1; padding:8px 4px; border:none; border-radius:11px; font-family:'Nunito',sans-serif; font-weight:800; font-size:11px; cursor:pointer; color:var(--sub); background:transparent; transition:all 0.2s; line-height:1.2; text-align:center; }
.mode-btn.active { color:#000; }
.mode-btn[data-mode="1"].active { background:var(--m1); }
.mode-btn[data-mode="2"].active { background:var(--m2); }
.mode-btn[data-mode="3"].active { background:var(--m3); }
.mode-btn .m-num { font-size:16px; display:block; margin-bottom:2px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:14px; flex:1; display:flex; flex-direction:column; min-height:0; gap:10px; box-shadow:0 8px 40px rgba(0,0,0,0.5); }
.progress-wrap { height:8px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; flex-shrink:0; }
.progress-bar { height:100%; border-radius:999px; transition:width 0.5s cubic-bezier(.34,1.56,.64,1); width:0%; }
.mode-1 .progress-bar { background:linear-gradient(90deg,var(--m1),#ffe566); }
.mode-2 .progress-bar { background:linear-gradient(90deg,var(--m2),#ff9ec6); }
.mode-3 .progress-bar { background:linear-gradient(90deg,var(--m3),#5fffda); }
.question-zone { border-radius:14px; padding:16px 12px 14px; text-align:center; flex-shrink:0; }
.mode-1 .question-zone { background:linear-gradient(135deg,rgba(246,201,14,0.15),rgba(246,201,14,0.05)); border:1px solid rgba(246,201,14,0.3); }
.mode-2 .question-zone { background:linear-gradient(135deg,rgba(255,107,157,0.15),rgba(255,107,157,0.05)); border:1px solid rgba(255,107,157,0.3); }
.mode-3 .question-zone { background:linear-gradient(135deg,rgba(0,212,170,0.15),rgba(0,212,170,0.05)); border:1px solid rgba(0,212,170,0.3); }
.q-label { font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; opacity:0.6; }
.mode-1 .q-label { color:var(--m1); } .mode-2 .q-label { color:var(--m2); } .mode-3 .q-label { color:var(--m3); }
.q-display { font-family:'Rubik',sans-serif; font-weight:900; font-size:clamp(32px,9vw,50px); line-height:1; margin-bottom:12px; direction:rtl; }
.mode-2 .q-display { direction:ltr; color:var(--m2); }
.mode-1 .q-display { color:var(--m1); }
.mode-3 .q-display { color:var(--m3); font-size:clamp(26px,7vw,40px); }
.speak-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:999px; border:none; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; cursor:pointer; transition:transform 0.15s; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
.mode-1 .speak-btn { background:var(--m1); color:#000; }
.mode-2 .speak-btn { background:var(--m2); color:#fff; }
.mode-3 .speak-btn { background:var(--m3); color:#000; }
.speak-btn:active { transform:scale(0.95); }
.speak-btn.speaking { animation:pulsebtn 0.7s ease-in-out infinite; }
@keyframes pulsebtn { 0%,100%{transform:scale(1);}50%{transform:scale(1.06);} }
.speak-btn svg { width:16px; height:16px; }
.options { display:grid; gap:7px; flex:1; min-height:0; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); }
.option { background:var(--opt); border:1.5px solid var(--border); border-radius:12px; padding:6px 10px; font-family:'Rubik',sans-serif; font-weight:700; font-size:clamp(15px,4.5vw,22px); color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.12s,transform 0.1s; min-height:0; }
.option:active:not(:disabled) { transform:scale(0.97); }
.option:disabled { cursor:not-allowed; }
.option.opt-5 { grid-column:1/3; }
.opt-char { font-size:clamp(18px,5.5vw,28px); font-weight:900; }
.mode-1 .option { direction:rtl; font-size:clamp(18px,6vw,28px); }
.option.correct { background:#16533a; border-color:var(--m3); animation:popIn 0.4s ease-out; }
.option.wrong { background:#5a1a1a; border-color:var(--red); animation:shake 0.4s ease-out; }
@keyframes popIn { 0%{transform:scale(1);}40%{transform:scale(1.05);}100%{transform:scale(1);} }
@keyframes shake { 0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);} }
.bottom-bar { flex-shrink:0; display:flex; flex-direction:column; gap:6px; }
.feedback { padding:8px 12px; border-radius:10px; text-align:center; font-weight:700; font-size:14px; display:none; border:1px solid var(--border); direction:rtl; line-height:1.4; }
.feedback.show { display:block; animation:slideUp 0.3s ease-out; }
.feedback.good { background:rgba(0,212,170,0.15); border-color:var(--m3); color:#5fffda; }
.feedback.bad { background:rgba(255,107,157,0.15); border-color:var(--m2); color:#ffb3ce; }
@keyframes slideUp { from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);} }
.next-btn { padding:13px; border-radius:12px; border:none; font-family:'Nunito',sans-serif; font-size:15px; font-weight:800; cursor:pointer; display:none; transition:transform 0.1s; color:#000; }
.next-btn.show { display:block; animation:slideUp 0.3s ease-out; }
.next-btn:active { transform:scale(0.98); }
.mode-1 .next-btn { background:var(--m1); }
.mode-2 .next-btn { background:var(--m2); color:#fff; }
.mode-3 .next-btn { background:var(--m3); }
.all-done { text-align:center; flex:1; display:none; flex-direction:column; justify-content:center; align-items:center; gap:10px; }
.all-done.show { display:flex; }
.all-done .big { font-size:56px; line-height:1; }
.all-done .title { font-family:'Rubik',sans-serif; font-weight:900; font-size:26px; }
.all-done .sub { color:var(--sub); font-size:14px; direction:rtl; }
.all-done .play-again { padding:13px 30px; border-radius:12px; border:none; font-family:'Nunito',sans-serif; font-size:15px; font-weight:800; cursor:pointer; margin-top:6px; color:#000; }
.mode-1 .all-done .play-again { background:var(--m1); }
.mode-2 .all-done .play-again { background:var(--m2); color:#fff; }
.mode-3 .all-done .play-again { background:var(--m3); }
.game-area { display:flex; flex-direction:column; flex:1; min-height:0; gap:8px; }
.game-area.hide { display:none; }
.cute-pop { position:fixed; pointer-events:none; z-index:999; top:0; user-select:none; overflow:visible; }
.cute-pop svg { width:100%; height:100%; display:block; }
@media (max-height:680px) { .q-display{font-size:28px;} .speak-btn{padding:8px 16px;font-size:12px;} .option{font-size:15px;} .mode-1 .option{font-size:18px;} }
</style>
</head>
<body>
<div class="app mode-1">
  <div class="header">
    <div class="logo"><span>Sound</span> Quest</div>
    <div class="stats">
      <div class="stat s-score">⭐ <span id="scoreEl">0</span></div>
      <div class="stat s-streak">🔥 <span id="streakEl">0</span></div>
    </div>
    <button class="reset-btn" id="resetBtn">↻</button>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="1"><span class="m-num">א</span>Hebrew Letters</button>
    <button class="mode-btn" data-mode="2"><span class="m-num">A</span>English Letters</button>
    <button class="mode-btn" data-mode="3"><span class="m-num">123</span>Hebrew Numbers</button>
  </div>
  <div class="card">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="game-area" id="gameArea">
      <div class="question-zone">
        <div class="q-label" id="qLabel">Hear the letter — pick the Hebrew</div>
        <div class="q-display" id="qDisplay">?</div>
        <button class="speak-btn" id="speakBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          Hear it again
        </button>
      </div>
      <div class="options" id="optionsEl"></div>
      <div class="bottom-bar">
        <div class="feedback" id="feedbackEl"><span id="feedbackEmoji"></span> <span id="feedbackText"></span></div>
        <button class="next-btn" id="nextBtn">next →</button>
      </div>
    </div>
    <div class="all-done" id="allDone">
      <div class="big">🏆</div>
      <div class="title">All Mastered!</div>
      <div class="sub" id="allDoneSub"></div>
      <button class="play-again" id="playAgainBtn">play again 🚀</button>
    </div>
  </div>
</div>
<script>
var vh=function(){document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px');};
vh();window.addEventListener('resize',vh);window.addEventListener('orientationchange',vh);

var HEBREW_LETTERS=[
  {display:'א',he:'אלף',speak:'אלף'},
  {display:'ב',he:'בית',speak:'בית'},
  {display:'ג',he:'גימל',speak:'גימל'},
  {display:'ד',he:'דלת',speak:'דלת'},
  {display:'ה',he:'הא',speak:'הה'},
  {display:'ו',he:'ואו',speak:'ואו'},
  {display:'ז',he:'זיין',speak:'זיין'},
  {display:'ח',he:'חית',speak:'חית'},
  {display:'ט',he:'טית',speak:'טית'},
  {display:'י',he:'יוד',speak:'יוד'},
  {display:'כ',he:'כף',speak:'כף'},
  {display:'ך',he:'כף סופית',speak:'כף סופית'},
  {display:'ל',he:'למד',speak:'למד'},
  {display:'מ',he:'מם',speak:'מם'},
  {display:'ם',he:'מם סופית',speak:'מם סופית'},
  {display:'נ',he:'נון',speak:'נון'},
  {display:'ן',he:'נון סופית',speak:'נון סופית'},
  {display:'ס',he:'סמך',speak:'סמך'},
  {display:'ע',he:'עין',speak:'עין'},
  {display:'פ',he:'פא',speak:'פא'},
  {display:'ף',he:'פא סופית',speak:'פא סופית'},
  {display:'צ',he:'צדי',speak:'צדי'},
  {display:'ץ',he:'צדי סופית',speak:'צדי סופית'},
  {display:'ק',he:'קוף',speak:'קוף'},
  {display:'ר',he:'ריש',speak:'ריש'},
  {display:'ש',he:'שין',speak:'שין'},
  {display:'ת',he:'תוו',speak:'תוו'}
];

var ENGLISH_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(c){return{display:c,name:c,speak:c};});

var HEBREW_NUMBERS=[
  {num:1, he:'אחד',speak:'אחד',display:'1'},
  {num:2, he:'שתיים',speak:'שתיים',display:'2'},
  {num:3, he:'שלוש',speak:'שלוש',display:'3'},
  {num:4, he:'ארבע',speak:'ארבע',display:'4'},
  {num:5, he:'חמש',speak:'חמש',display:'5'},
  {num:6, he:'שש',speak:'שש',display:'6'},
  {num:7, he:'שבע',speak:'שבע',display:'7'},
  {num:8, he:'שמונה',speak:'שמונה',display:'8'},
  {num:9, he:'תשע',speak:'תשע',display:'9'},
  {num:10,he:'עשר',speak:'עשר',display:'10'},
  {num:11,he:'אחד עשר',speak:'אחד עשר',display:'11'},
  {num:12,he:'שתיים עשר',speak:'שתיים עשר',display:'12'},
  {num:13,he:'שלושה עשר',speak:'שלושה עשר',display:'13'},
  {num:14,he:'ארבעה עשר',speak:'ארבעה עשר',display:'14'},
  {num:15,he:'חמישה עשר',speak:'חמישה עשר',display:'15'},
  {num:16,he:'שישה עשר',speak:'שישה עשר',display:'16'},
  {num:17,he:'שבעה עשר',speak:'שבעה עשר',display:'17'},
  {num:18,he:'שמונה עשר',speak:'שמונה עשר',display:'18'},
  {num:19,he:'תשעה עשר',speak:'תשעה עשר',display:'19'},
  {num:20,he:'עשרים',speak:'עשרים',display:'20'}
];

var PRAISE=[
  'יופי! 🌟','אתה גאון! 🤩','וואו! 🥳',
  'נייס! 👏','כל הכבוד! 🏆','מדהים! 🚀',
  'בראבו! 💪','אחלה! 😍','עצום! ⭐',
  'איזה כיף! 🎈','ממשיך! 👍','בראבו! 🎉',
  'אתה סופרסטאר! 🦄','איזה חכמון! 🧠',
  'פנטסטי! 🌈','אתה מדהים! 💎',
  'הצלחת! 🍓','עבודה יפה! 🌟',
  'כוכב! 💫','אתה הכי טוב! 👑',
  'מצוין! 🍏','איזה שיא! 💃',
  'אתה מקצוען! 🔥','מושלם! 🤩','הלוחם! 🥷'
];
var ENCOURAGE=['נסה שוב!','כמעט!','בוא, תוכל!','כל כך!'];

var CUTE_LIST=[
  '🐱','🐈','🐶','🦄','😸',
  '🌸','🌹','🌺','🌷','🍀',
  '👼','⭐','🌈','🌟','💫',
  '💜','💙','💚','💛','🧸'
];
var POODLE='🐩';
var BUNNY_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 82"><ellipse cx="30" cy="64" rx="18" ry="15" fill="#111" stroke="white" stroke-width="2.5"/><ellipse cx="30" cy="40" rx="14" ry="13" fill="#111" stroke="white" stroke-width="2.5"/><ellipse cx="21" cy="13" rx="5" ry="14" fill="#111" stroke="white" stroke-width="2.5"/><ellipse cx="21" cy="13" rx="2.5" ry="10" fill="#ff9aa2"/><ellipse cx="39" cy="13" rx="5" ry="14" fill="#111" stroke="white" stroke-width="2.5"/><ellipse cx="39" cy="13" rx="2.5" ry="10" fill="#ff9aa2"/><circle cx="24" cy="37" r="3.5" fill="white"/><circle cx="24" cy="37" r="2" fill="#1a1a1a"/><circle cx="24.8" cy="36.2" r="0.8" fill="white"/><circle cx="36" cy="37" r="3.5" fill="white"/><circle cx="36" cy="37" r="2" fill="#1a1a1a"/><circle cx="36.8" cy="36.2" r="0.8" fill="white"/><ellipse cx="30" cy="43" rx="2.5" ry="1.8" fill="#ff9aa2"/><path d="M27.5 45 Q30 47.5 32.5 45" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="47" cy="65" r="6" fill="#2a2a2a" stroke="white" stroke-width="1.5"/></svg>';
var cuteCounter=0;

var currentMode=1,score=0,streak=0,queue=[],mastered={},answered=false,wrongThisRound=false,currentItem=null;
try{var sv=localStorage.getItem('sqv2');if(sv){var p=JSON.parse(sv);score=p.score||0;mastered=p.mastered||{};streak=p.streak||0;}}catch(e){}
function save(){try{localStorage.setItem('sqv2',JSON.stringify({score:score,mastered:mastered,streak:streak}));}catch(e){}}

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getPool(){return currentMode===1?HEBREW_LETTERS:currentMode===2?ENGLISH_LETTERS:HEBREW_NUMBERS;}
function getModeKey(item){return currentMode===1?'m1_'+item.display:currentMode===2?'m2_'+item.display:'m3_'+item.num;}
function masteredCount(){var pool=getPool(),n=0;for(var i=0;i<pool.length;i++)if(mastered[getModeKey(pool[i])])n++;return n;}
function buildQueue(){var pool=getPool(),un=[],ma=[];for(var i=0;i<pool.length;i++){if(mastered[getModeKey(pool[i])])ma.push(pool[i]);else un.push(pool[i]);}queue=shuffle(un).concat(shuffle(ma));}
function getNext(){if(queue.length===0)buildQueue();return queue.shift()||null;}

var audioCtx=null;
function getACtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playNote(freq,t,dur,type,gain){var ctx=getACtx();if(!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur);}
function playCorrect(){var ctx=getACtx();if(!ctx)return;var n=ctx.currentTime;playNote(523,n,0.12,'triangle',0.22);playNote(659,n+0.09,0.12,'triangle',0.22);playNote(784,n+0.18,0.12,'triangle',0.22);playNote(1046,n+0.27,0.28,'triangle',0.28);}
function playWrong(){var ctx=getACtx();if(!ctx)return;var n=ctx.currentTime;playNote(330,n,0.15,'sine',0.2);playNote(294,n+0.15,0.15,'sine',0.2);playNote(262,n+0.30,0.25,'sine',0.2);}
function playMastery(){var ctx=getACtx();if(!ctx)return;var n=ctx.currentTime;playNote(523,n,0.18,'triangle',0.28);playNote(659,n+0.13,0.18,'triangle',0.28);playNote(784,n+0.26,0.18,'triangle',0.28);playNote(1046,n+0.39,0.35,'triangle',0.32);playNote(1319,n+0.50,0.45,'triangle',0.28);}

var voices=[];
function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[];}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
function findVoice(lang){for(var i=0;i<voices.length;i++)if(voices[i].lang&&voices[i].lang.indexOf(lang)===0)return voices[i];return null;}
function speak(text,lang,doneCb){if(!window.speechSynthesis){if(doneCb)doneCb();return;}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=0.82;u.pitch=1.05;var v=findVoice(lang==='he-IL'?'he':'en');if(v)u.voice=v;u.onend=function(){if(doneCb)doneCb();};u.onerror=function(){if(doneCb)doneCb();};window.speechSynthesis.speak(u);}
function speakCurrent(){if(!currentItem)return;speakBtn.classList.add('speaking');var done=function(){speakBtn.classList.remove('speaking');};if(currentMode===1)speak(currentItem.speak,'he-IL',done);else if(currentMode===2)speak(currentItem.speak,'en-US',done);else speak(currentItem.speak,'he-IL',done);}

function dropOne(emoji,isSvg,colorFilter,big){
  var p=document.createElement('div');
  p.className='cute-pop';
  var sz=big?(44+Math.random()*16):(24+Math.random()*12);
  p.style.left=(Math.random()*86+2)+'vw';
  p.style.top=(-sz*1.5)+'px';
  if(isSvg){
    p.style.width=sz+'px';
    p.style.height=(sz*1.4)+'px';
    p.innerHTML=BUNNY_SVG;
  }else{
    p.style.width=sz+'px';
    p.style.height=sz+'px';
    p.style.fontSize=sz+'px';
    p.style.lineHeight='1';
    if(colorFilter)p.style.filter=colorFilter;
    p.textContent=emoji;
  }
  document.body.appendChild(p);
  var dur=2100+Math.random()*1100;
  var drift=(Math.random()-0.5)*120;
  var rot=(Math.random()-0.5)*340;
  p.animate([
    {transform:'translateY(0) translateX(0) rotate(0deg) scale('+(big?1.25:1)+')',opacity:1},
    {transform:'translateY('+(window.innerHeight+sz+50)+'px) translateX('+drift+'px) rotate('+rot+'deg) scale(0.2)',opacity:0}
  ],{duration:dur,easing:'ease-in',fill:'forwards'});
  setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},dur+100);
}

function fireCute(n){
  cuteCounter++;
  var count=n||18;
  var isSvg=false,emoji=null,filter=null,big=false;
  if(cuteCounter%5===0){
    isSvg=true; big=true;
  }else if(cuteCounter%3===0){
    emoji=POODLE;
    filter='sepia(1) saturate(3) hue-rotate(340deg) brightness(0.7)';
    big=true;
  }else{
    emoji=CUTE_LIST[Math.floor(Math.random()*CUTE_LIST.length)];
  }
  for(var i=0;i<count;i++){
    (function(idx){
      setTimeout(function(){dropOne(emoji,isSvg,filter,big);},idx*72);
    })(i);
  }
}

var appEl=document.querySelector('.app');
var qDisplayEl=document.getElementById('qDisplay');
var qLabelEl=document.getElementById('qLabel');
var speakBtn=document.getElementById('speakBtn');
var optionsEl=document.getElementById('optionsEl');
var feedbackEl=document.getElementById('feedbackEl');
var feedbackEmoji=document.getElementById('feedbackEmoji');
var feedbackText=document.getElementById('feedbackText');
var nextBtn=document.getElementById('nextBtn');
var scoreEl=document.getElementById('scoreEl');
var streakEl=document.getElementById('streakEl');
var progressBar=document.getElementById('progressBar');
var gameArea=document.getElementById('gameArea');
var allDone=document.getElementById('allDone');
var allDoneSub=document.getElementById('allDoneSub');
var playAgainBtn=document.getElementById('playAgainBtn');
var resetBtn=document.getElementById('resetBtn');
var modeBtns=document.querySelectorAll('.mode-btn');

function updateStats(){scoreEl.textContent=score;streakEl.textContent=streak;}
function updateProgress(){var pool=getPool(),m=masteredCount();progressBar.style.width=(pool.length>0?(m/pool.length*100):0)+'%';}
function setMode(m){
  currentMode=m;appEl.className='app mode-'+m;
  for(var i=0;i<modeBtns.length;i++)modeBtns[i].classList.toggle('active',parseInt(modeBtns[i].dataset.mode)===m);
  if(m===1)qLabelEl.textContent='Hear the letter — pick the Hebrew';
  else if(m===2)qLabelEl.textContent='Hear the letter — pick the English';
  else qLabelEl.textContent='Hear the number — pick the digit';
}

function newQuestion(){
  answered=false;wrongThisRound=false;
  feedbackEl.classList.remove('show','good','bad');
  nextBtn.classList.remove('show');
  var pool=getPool();
  if(masteredCount()===pool.length){showAllDone();return;}
  var item=getNext();if(!item){showAllDone();return;}
  currentItem=item;
  if(currentMode===1){qDisplayEl.textContent=item.he;qDisplayEl.style.direction='rtl';}
  else if(currentMode===2){qDisplayEl.textContent=item.display;qDisplayEl.style.direction='ltr';}
  else{qDisplayEl.textContent=item.he;qDisplayEl.style.direction='rtl';}
  updateProgress();
  var distPool=pool.slice();
  for(var i=0;i<distPool.length;i++)if(distPool[i]===item){distPool.splice(i,1);break;}
  var distractors=shuffle(distPool).slice(0,4);
  var allOpts=shuffle([item].concat(distractors));
  optionsEl.innerHTML='';
  for(var i=0;i<allOpts.length;i++){
    (function(opt,idx){
      var btn=document.createElement('button');
      btn.className='option'+(idx===4?' opt-5':'');
      btn.innerHTML='<span class="opt-char">'+opt.display+'</span>';
      btn.addEventListener('click',function(){handleAnswer(btn,opt,item);});
      optionsEl.appendChild(btn);
    })(allOpts[i],i);
  }
  setTimeout(function(){speakCurrent();},300);
}

function handleAnswer(btn,chosen,correct){
  if(answered)return;
  var allBtns=optionsEl.querySelectorAll('.option');
  var isCorrect=currentMode===3?(chosen.num===correct.num):(chosen.display===correct.display);
  if(isCorrect){
    answered=true;
    for(var i=0;i<allBtns.length;i++)allBtns[i].disabled=true;
    btn.classList.add('correct');
    var k=getModeKey(correct),newlyMastered=false;
    if(!wrongThisRound&&!mastered[k]){mastered[k]=true;newlyMastered=true;}
    if(!wrongThisRound){streak++;score++;}
    save();updateStats();updateProgress();
    feedbackEl.classList.add('show','good');
    if(newlyMastered){
      feedbackEmoji.textContent='⭐';
      feedbackText.textContent=(currentMode===1?correct.he+' = '+correct.display:currentMode===2?correct.display:correct.he+' = '+correct.num)+' — מסטר!';
      playMastery();fireCute(40);
    }else{
      feedbackEmoji.textContent=streak>=5?'🔥':'💕';
      feedbackText.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
      playCorrect();
      if(!wrongThisRound)fireCute(18);
    }
    nextBtn.classList.add('show');
    if(masteredCount()===getPool().length)setTimeout(showAllDone,1600);
  }else{
    btn.classList.add('wrong');btn.disabled=true;
    if(!wrongThisRound){wrongThisRound=true;streak=0;save();updateStats();}
    feedbackEl.classList.add('show','bad');
    feedbackEmoji.textContent='💪';
    feedbackText.textContent=ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)];
    playWrong();
  }
}

function showAllDone(){
  gameArea.classList.add('hide');allDone.classList.add('show');
  allDoneSub.textContent=currentMode===1?'ידעת את כל האותיות!':currentMode===2?'You know all the letters!':'ידעת את המספרים 1-20!';
  fireCute(60);setTimeout(function(){fireCute(60);},500);
  playMastery();
}

speakBtn.addEventListener('click',function(){getACtx();speakCurrent();});
nextBtn.addEventListener('click',newQuestion);
playAgainBtn.addEventListener('click',function(){
  mastered={};score=0;streak=0;save();
  allDone.classList.remove('show');gameArea.classList.remove('hide');
  buildQueue();updateStats();updateProgress();newQuestion();
});
resetBtn.addEventListener('click',function(){
  if(confirm('Reset all progress?')){
    mastered={};score=0;streak=0;save();
    allDone.classList.remove('show');gameArea.classList.remove('hide');
    buildQueue();updateStats();updateProgress();newQuestion();
  }
});
for(var mi=0;mi<modeBtns.length;mi++){
  (function(btn){
    btn.addEventListener('click',function(){
      var m=parseInt(btn.dataset.mode);
      setMode(m);allDone.classList.remove('show');gameArea.classList.remove('hide');
      buildQueue();updateStats();updateProgress();newQuestion();
    });
  })(modeBtns[mi]);
}

function boot(){setMode(1);buildQueue();updateStats();updateProgress();newQuestion();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
</html>
